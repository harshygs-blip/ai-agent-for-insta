<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Business Login | The Harsh Seller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(16, 22, 36, 0.8);
      --border: rgba(255, 255, 255, 0.08);
      --accent-green: #2ed573;
      --cyan: #00d2d3;
      --text: #f1f2f6;
      --text-sub: #8395a7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 10% 10%, #101626 0%, #06080e 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 540px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(46, 213, 115, 0.15);
      border: 2px solid var(--accent-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h1 { font-family: 'Outfit', sans-serif; font-size: 1.8rem; }
    p { color: var(--text-sub); font-size: 0.95rem; line-height: 1.5; }
    .status-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--cyan);
      word-break: break-all;
      width: 100%;
    }
    .btn {
      background: linear-gradient(135deg, var(--accent-green), #10ac84);
      color: #000;
      padding: 12px 28px;
      border-radius: 10px;
      font-weight: 800;
      text-decoration: none;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(46, 213, 115, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Business Login Authorized</h1>
    <p>Your Instagram Professional / Business account has been successfully connected to <strong>The Harsh Seller AI Customer Hub</strong>.</p>
    <div class="status-box" id="authStatus">OAuth 2.0 Handshake Verified (Status 200)</div>
    <p style="font-size: 0.85rem;">You can now close this window or return to the main store dashboard.</p>
    <a href="index.html" class="btn">Return to Store Home</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      document.getElementById('authStatus').innerText = 'Authorization Code Received: ' + code.substring(0, 16) + '...';
    }
  </script>
</body>
</html>
